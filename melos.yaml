name: flutter_turbo_bridge
repository: https://github.com/mark-nicepants/flutter_turbo_bridge

packages:
  - packages/*
  - apps/*

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
    packageFilters:
      dirExists: lib

  test:dart:
    description: Run tests for pure Dart packages
    run: dart test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      scope:
        - turbo_bridge_client
        - turbo_bridge_mcp
        - benchmark

  test:flutter:
    description: Run tests for Flutter packages
    run: flutter test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
      scope:
        - turbo_bridge

  format:
    run: dart format --line-length 80 --set-exit-if-changed .
