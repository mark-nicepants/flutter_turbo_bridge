name: turbo_bridge
description: In-app companion server for ultra-fast Flutter AI interaction. Exposes HTTP/WebSocket endpoints for screenshots, widget tree inspection, and gesture injection.
version: 0.1.6
resolution: workspace
homepage: https://github.com/mark-nicepants/flutter_turbo_bridge/tree/main/packages/turbo_bridge
repository: https://github.com/mark-nicepants/flutter_turbo_bridge
issue_tracker: https://github.com/mark-nicepants/flutter_turbo_bridge/issues
documentation: https://github.com/mark-nicepants/flutter_turbo_bridge/tree/main/packages/turbo_bridge
topics:
  - flutter
  - automation
  - testing
  - screenshots
  - widgets

environment:
  # http_interceptor ^3.0.0 requires Dart >=3.8.0 (Flutter 3.32+).
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  # Adapters under `lib/interceptors/` import these. They are only
  # pulled into a host app's build when that app actually imports the
  # adapter entry point, but pub.dev requires every `lib/` import to
  # come from `dependencies` (not `dev_dependencies`).
  dio: ^5.0.0
  # The http adapter plugs into `http_interceptor`'s `HttpInterceptor`
  # contract; it re-exports `package:http` (`BaseRequest`,
  # `StreamedResponse`, ...) so we don't depend on `http` directly.
  http_interceptor: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0

flutter:
  assets:
    - lib/src/devtools/web/index.html
