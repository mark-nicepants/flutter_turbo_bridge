# CI — Analyze, Test, Format across all packages
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Test (pure Dart packages)
        run: |
          cd packages/turbo_bridge_client && dart test
          cd ../turbo_bridge_mcp && dart test

      - name: Test (Flutter package)
        run: cd packages/turbo_bridge && flutter test

  benchmark:
    name: Benchmark (macOS)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Build & run target app
        working-directory: apps/target_app
        run: |
          flutter build macos --debug
          open build/macos/Build/Products/Debug/benchmark_target_app.app &
          sleep 5

      - name: Run benchmark
        working-directory: apps/benchmark
        run: dart run bin/benchmark.dart --bridge-host localhost --bridge-port 8888
