# Publish packages to pub.dev
#
# pub.dev only allows GitHub Actions automation for packages that already exist.
# Publish the first version of each package manually, then enable automated
# publishing on each package's pub.dev Admin tab for:
#   repository: mark-nicepants/flutter_turbo_bridge
#   tag pattern: v{{version}}
# No long-lived repository secret is required when using pub.dev trusted
# publishing from GitHub Actions.
#
# Triggered manually or on version tag push after main-branch CI is green.
# Packages are published in dependency order:
#   1. turbo_bridge_client (no internal deps)
#   2. turbo_bridge (no internal deps)
#   3. turbo_bridge_mcp (depends on turbo_bridge_client)
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # Required for pub.dev OIDC authentication

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run shared package checks
        uses: ./.github/actions/package-checks

      - name: Dry run publish
        if: ${{ github.event.inputs.dry-run == 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run != 'false' }}
        run: melos publish --dry-run --yes

      - name: Publish to pub.dev
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false') }}
        run: melos publish --no-dry-run --yes
